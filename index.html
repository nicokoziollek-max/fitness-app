<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070c0b">
    <title>NH Performance | Athlete Tracking</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="app-shell">
      <div id="pull-refresh" class="pull-refresh">Aktualisiert</div>
      <header class="topbar">
        <div>
          <p class="eyebrow">NH Performance</p>
          <h1 id="screen-greeting">Hi, Nicolas</h1>
        </div>
        <button class="profile-chip" data-go="profile" aria-label="Profil öffnen" title="Profil">
          <img src="assets/profile-nicolas.jpg" alt="">
        </button>
      </header>
      <main id="app" aria-live="polite"></main>
      <nav class="bottom-nav" aria-label="Hauptnavigation">
        <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span>Heute</button>
        <button class="nav-item" data-tab="tracker"><span class="nav-icon">☷</span>Einträge</button>
        <button class="nav-item" data-tab="training"><span class="nav-icon">▥</span>Tracker</button>
        <button class="nav-item" data-tab="calendar"><span class="nav-icon">□</span>Kalender</button>
        <button class="nav-item" data-tab="profile"><span class="nav-icon">⚙</span>Einstellungen</button>
      </nav>
    </div>
    <dialog id="workout-dialog" class="workout-dialog">
      <form id="workout-form" method="dialog"></form>
    </dialog>
    <script src="data/fitness-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
