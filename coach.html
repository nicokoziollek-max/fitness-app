<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NH Coach Hub | Klientenübersicht</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="coach.css">
  </head>
  <body>
    <div class="coach-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">NH</span>
          <div>
            <p class="caption">Coach Portal</p>
            <h1>Performance</h1>
          </div>
        </div>
        <nav class="side-nav" aria-label="Coach Navigation">
          <button class="active" data-view="dashboard">Dashboard</button>
          <button data-view="clients">Klienten</button>
          <button data-view="checkins">Check-ins</button>
          <button data-view="programs">Programme</button>
          <button data-view="billing">Abrechnung</button>
        </nav>
        <article class="side-card">
          <p class="caption">Monatlicher Umsatz</p>
          <strong id="sidebar-revenue"></strong>
          <p class="muted">Aktive Coachings</p>
        </article>
        <a class="client-app-link" href="./">Klienten-App öffnen</a>
      </aside>
      <main class="dashboard">
        <header class="dashboard-header">
          <div>
            <p class="caption">Coach Dashboard</p>
            <h2>Klientenübersicht</h2>
          </div>
          <div class="header-actions">
            <label class="search">Suche <input id="client-search" type="search" placeholder="Klient suchen"></label>
            <button class="primary">+ Neuer Klient</button>
          </div>
        </header>
        <section class="summary-grid" id="portfolio-summary"></section>
        <section id="workspace"></section>
      </main>
    </div>
    <dialog id="presentation-dialog" class="presentation-dialog">
      <div id="presentation-content"></div>
    </dialog>
    <script src="data/fitness-data.js"></script>
    <script src="coach.js"></script>
  </body>
</html>
